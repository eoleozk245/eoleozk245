<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-labelledby="t d"><title id="t">Visão geral do GitHub</title><desc id="d">Números reais da conta no GitHub: repositórios públicos, contribuições, commits e pull requests.</desc><style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono','Liberation Mono',Menlo,monospace}.s{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}text{white-space:pre}</style><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f7fcb"/><stop offset="1" stop-color="#55c7ff"/></linearGradient></defs><g><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/><rect x="0.5" y="0.5" width="231" height="119" rx="12" fill="#e4f3ff" stroke="#9fd4f5"/><rect x="20" y="0.5" width="64" height="3" rx="1.5" fill="url(#gv)"/><text class="m" x="20" y="34" font-size="12" fill="#4a6076">REPOSITÓRIOS PÚBLICOS</text><text class="s" x="20" y="82" font-size="42" font-weight="800" fill="url(#gv)">9</text><text class="m" x="20" y="104" font-size="11" fill="#6b8199">na minha conta</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2000;1" dur="0.75s" begin="0s" fill="freeze"/><rect x="256.5" y="0.5" width="231" height="119" rx="12" fill="#e4f3ff" stroke="#9fd4f5"/><rect x="276" y="0.5" width="64" height="3" rx="1.5" fill="url(#gv)"/><text class="m" x="276" y="34" font-size="12" fill="#4a6076">CONTRIBUIÇÕES</text><text class="s" x="276" y="82" font-size="42" font-weight="800" fill="url(#gv)">49</text><text class="m" x="276" y="104" font-size="11" fill="#6b8199">últimos 12 meses</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3333;1" dur="0.9s" begin="0s" fill="freeze"/><rect x="512.5" y="0.5" width="231" height="119" rx="12" fill="#e4f3ff" stroke="#9fd4f5"/><rect x="532" y="0.5" width="64" height="3" rx="1.5" fill="url(#gv)"/><text class="m" x="532" y="34" font-size="12" fill="#4a6076">COMMITS</text><text class="s" x="532" y="82" font-size="42" font-weight="800" fill="url(#gv)">24</text><text class="m" x="532" y="104" font-size="11" fill="#6b8199">últimos 12 meses</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="1.05s" begin="0s" fill="freeze"/><rect x="768.5" y="0.5" width="231" height="119" rx="12" fill="#e4f3ff" stroke="#9fd4f5"/><rect x="788" y="0.5" width="64" height="3" rx="1.5" fill="url(#gv)"/><text class="m" x="788" y="34" font-size="12" fill="#4a6076">PULL REQUESTS</text><text class="s" x="788" y="82" font-size="42" font-weight="800" fill="url(#gv)">15</text><text class="m" x="788" y="104" font-size="11" fill="#6b8199">últimos 12 meses</text></g></svg>
